name: Dinko V2 checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  v2-dry-run:
    name: V2 LiveKit configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      DINKO_CONTEXT_FILE: dinko_v2_test_context.json
      DINKO_BINDINGS_FILE: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check LiveKit entry point and synthetic session configuration
        run: |
          python3 -m py_compile dinko_v2_livekit.py
          python3 - <<'PYTHON'
          from dinko_v2_prompt import new_session
          from dinko_v2_runtime import prepare_session

          config, greeting = prepare_session(new_session())
          assert config["model"]
          assert config["audio"]["output"]["voice"]
          assert config["delegation"]["responses"]["tool_choice"] == "none"
          assert greeting["content"]
          PYTHON
